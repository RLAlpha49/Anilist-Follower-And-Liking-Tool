name: Build Electron App

on:
    push:
        branches: [electron-app]
    pull_request:
        branches: [electron-app]

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload Windows Build Artifacts (.exe and .msi)
              if: ${{ (github.event_name == 'push' && github.event.head_commit.id == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha == github.sha) }}
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: |
                      out/make/squirrel.windows/x64/Nakama-Setup.exe
                      out/make/squirrel.windows/x64/Nakama-Setup.msi

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload macOS Build Artifacts
              if: ${{ (github.event_name == 'push' && github.event.head_commit.id == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha == github.sha) }}
              uses: actions/upload-artifact@v4
              with:
                  name: macos-build
                  path: |
                      out/make/Nakama-1.0.0-arm64.dmg
                      out/make/zip/darwin/arm64/Nakama-darwin-arm64-1.0.0.zip

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload Linux Build Artifacts
              if: ${{ (github.event_name == 'push' && github.event.head_commit.id == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha == github.sha) }}
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: |
                      out/make/deb/x64/nakama_1.0.0_amd64.deb
                      out/make/rpm/x64/nakama-1.0.0-1.x86_64.rpm
