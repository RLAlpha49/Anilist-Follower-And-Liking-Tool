name: Build Electron App

on:
    push:
        branches: [electron-app]
    pull_request:
        branches: [electron-app]

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload Windows Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: out/make/*

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload macOS Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos-build
                  path: out/make/*

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: npm install
            - run: npm run make
            - name: Upload Linux Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: out/make/*
